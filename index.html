<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forms Dashboard</title>
    <link rel="stylesheet" href="style.css?v=4">
</head>
<body data-theme="ember">

<div class="app">

    <header class="top-bar">
        <div>
            <p class="eyebrow">Google Forms Organizer</p>
            <h1>Forms Dashboard</h1>
            <p class="subtitle">Organized links for formatives, summatives, quizzes, and more.</p>
        </div>

        <div class="theme-panel">
            <p class="theme-label">Palette</p>

            <div class="theme-buttons">
                <button class="theme-btn" data-theme="ocean" type="button">
                    <span class="theme-dot ocean-dot"></span>
                    Ocean
                </button>

                <button class="theme-btn" data-theme="violet" type="button">
                    <span class="theme-dot violet-dot"></span>
                    Violet
                </button>

                <button class="theme-btn" data-theme="sunset" type="button">
                    <span class="theme-dot sunset-dot"></span>
                    Sunset
                </button>

                <button class="theme-btn" data-theme="dusk" type="button">
                    <span class="theme-dot dusk-dot"></span>
                    Dusk
                </button>

                <button class="theme-btn active" data-theme="ember" type="button">
                    <span class="theme-dot ember-dot"></span>
                    Ember
                </button>

                <button class="theme-btn" data-theme="forest" type="button">
                    <span class="theme-dot forest-dot"></span>
                    Forest
                </button>
            </div>
        </div>
    </header>

    <main class="main-card">
        <div class="nav-row">
            <button id="backBtn" class="back-btn hidden">← Back</button>
            <div id="breadcrumb" class="breadcrumb">Home</div>
        </div>

        <section id="cardContainer" class="card-grid"></section>
    </main>

</div>

<script src="data.js?v=4"></script>
<script src="script.js?v=4"></script>
</body>
</html>
