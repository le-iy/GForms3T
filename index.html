<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forms Central</title>
    <link rel="stylesheet" href="style.css?v=9">
</head>
<body data-theme="ember">

<div class="app">

    <header class="top-bar">
        <div class="brand-block">
            <p class="eyebrow">Reviewers Organizer</p>
            <h1>Forms Central</h1>
            <p class="subtitle">Organized links for formatives, summatives, quizzes, and more.</p>
        </div>

        <div class="controls-panel">
            <div class="mode-switch">
                <button id="practiceModeBtn" class="mode-btn active" type="button">
                    Practice Links
                </button>
                <button id="editModeBtn" class="mode-btn" type="button">
                    Edit Links
                </button>
            </div>

            <select id="themeSelect" class="theme-select">
                <option value="ocean">🌊 Ocean</option>
                <option value="violet">🟣 Violet</option>
                <option value="sunset">🌅 Sunset</option>
                <option value="dusk">🌆 Dusk</option>
                <option value="ember">🔥 Ember</option>
                <option value="forest">🌲 Forest</option>
                <option value="luxury">🖤 Luxury</option>
                <option value="retro">🧡 Retro</option>
                <option value="pop">💗 Pop</option>
                <option value="lotus">🪷 Lotus</option>
                <option value="gothic">🌙 Gothic</option>
                <option value="depths">🪼 Depths</option>
            </select>
        </div>
    </header>

    <main class="main-card">
        <div class="nav-row">
            <button id="backBtn" class="back-btn hidden" type="button">← Back</button>
            <div id="breadcrumb" class="breadcrumb">Home</div>
        </div>

        <section id="cardContainer" class="list-grid"></section>
    </main>

</div>

<script src="data.js?v=9"></script>
<script src="script.js?v=9"></script>
</body>
</html>
